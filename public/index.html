<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <title>Spymaster</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #111827;
      color: #fff;
    }

    .app {
      max-width: 1000px;
      margin: auto;
      padding: 14px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 10px;
    }

    .panel {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button,
    input {
      border: 0;
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 15px;
    }

    button {
      font-weight: 800;
    }

    .redBtn {
      background: #b91c1c;
      color: white;
    }

    .blueBtn {
      background: #1d4ed8;
      color: white;
    }

    .gold {
      background: #f59e0b;
      color: #111;
    }

    .gray {
      background: #374151;
      color: white;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .card {
      aspect-ratio: 1.35;
      border-radius: 10px;
      background: #e5d7bd;
      color: #111827;
      border: 3px solid #c5b38d;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      font-weight: 900;
      font-size: 14px;
    }

    .card.red {
      background: #b91c1c;
      color: white;
      border-color: #7f1d1d;
    }

    .card.blue {
      background: #1d4ed8;
      color: white;
      border-color: #1e3a8a;
    }

    .card.neutral {
      background: #9ca3af;
      color: #111827;
      border-color: #6b7280;
    }

    .card.assassin {
      background: #090909;
      color: white;
      border-color: #000;
    }

    .card.secret-red {
      box-shadow: inset 0 0 0 4px #ef4444;
    }

    .card.secret-blue {
      box-shadow: inset 0 0 0 4px #3b82f6;
    }

    .card.secret-neutral {
      box-shadow: inset 0 0 0 4px #9ca3af;
    }

    .card.secret-assassin {
      box-shadow: inset 0 0 0 4px #000;
      background: #d1d5db;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-bottom: 10px;
    }

    .stat {
      background: #1f2937;
      padding: 9px;
      border-radius: 10px;
      text-align: center;
    }

    .small {
      font-size: 11px;
      color: #9ca3af;
    }

    .big {
      font-weight: 900;
    }

    #msg {
      min-height: 20px;
      color: #fbbf24;
      margin: 8px 0;
    }

    .player {
      font-size: 13px;
      padding: 5px 8px;
      background: #111827;
      border-radius: 8px;
    }

    input {
      background: #f3f4f6;
      color: #111;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 620px) {
      .card {
        font-size: 11px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>
      🕵️ Spymaster
      <span id="room"></span>
    </h1>

    <div id="msg"></div>

    <!-- LOBBY -->

    <section
      id="lobby"
      class="panel hidden"
    >

      <b>Elegí equipo</b>

      <div
        class="row"
        style="margin:10px 0"
      >

        <button
          class="redBtn"
          onclick="join('red')"
        >
          🔴 Rojo
        </button>

        <button
          class="blueBtn"
          onclick="join('blue')"
        >
          🔵 Azul
        </button>

        <button
          class="gray"
          onclick="beSpy()"
        >
          Ser Spymaster
        </button>

        <!-- NUEVO: MODO PRUEBA -->

        <button
          id="testBtn"
          class="gray hidden"
          onclick="enableTestMode()"
        >
          🧪 Modo prueba
        </button>

        <button
          id="startBtn"
          class="gold hidden"
          onclick="startGame()"
        >
          Empezar
        </button>

      </div>

      <div
        id="players"
        class="row"
      ></div>

    </section>


    <!-- JUEGO -->

    <section
      id="game"
      class="hidden"
    >

      <div class="stats">

        <div class="stat">
          <div class="small">
            Turno
          </div>

          <div
            id="turn"
            class="big"
          ></div>
        </div>

        <div class="stat">
          <div class="small">
            Rojo
          </div>

          <div
            id="rc"
            class="big"
          ></div>
        </div>

        <div class="stat">
          <div class="small">
            Azul
          </div>

          <div
            id="bc"
            class="big"
          ></div>
        </div>

        <div class="stat">
          <div class="small">
            Pista
          </div>

          <div
            id="clueView"
            class="big"
          >
            —
          </div>
        </div>

      </div>


      <div
        id="clueBox"
        class="panel hidden"
      >

        <div class="row">

          <input
            id="clue"
            placeholder="Pista"
          >

          <input
            id="num"
            type="number"
            min="0"
            max="9"
            value="2"
            style="width:75px"
          >

          <button
            class="gold"
            onclick="sendClue()"
          >
            Dar pista
          </button>

        </div>

      </div>


      <div
        id="board"
        class="board"
      ></div>


      <div
        class="row"
        style="margin-top:10px"
      >

        <button
          id="endBtn"
          class="gray hidden"
          onclick="endTurn()"
        >
          Terminar turno
        </button>

      </div>

    </section>

  </div>


  <script>

    const tg =
      window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    const initData =
      tg.initData;


    let room = (
      tg.initDataUnsafe?.start_param ||
      new URLSearchParams(
        location.search
      ).get("room") ||
      ""
    ).toUpperCase();


    document
      .getElementById("room")
      .textContent =
        room
          ? `— ${room}`
          : "";


    let state = null;


    function say(s) {

      document
        .getElementById("msg")
        .textContent =
          s || "";

    }


    async function api(
      path,
      method = "GET",
      body
    ) {

      const r =
        await fetch(
          path,
          {
            method,

            headers: {
              "content-type":
                "application/json",

              "X-Telegram-Init-Data":
                initData
            },

            body:
              body
                ? JSON.stringify(body)
                : undefined
          }
        );


      const j =
        await r
          .json()
          .catch(
            () => ({
              error:
                "Respuesta inválida"
            })
          );


      if (!r.ok) {

        throw new Error(
          j.error ||
          "Error"
        );

      }


      return j;

    }


    async function act(
      path,
      body
    ) {

      try {

        state =
          await api(
            path,
            "POST",
            body
          );

        render();

      } catch (e) {

        say(e.message);

        tg.HapticFeedback
          ?.notificationOccurred(
            "error"
          );

      }

    }


    async function join(team) {

      await act(
        `/api/room/${room}/join`,
        { team }
      );

    }


    async function beSpy() {

      await act(
        `/api/room/${room}/spymaster`,
        {}
      );

    }


    /* NUEVO: MODO PRUEBA */

    async function enableTestMode() {

      await act(
        `/api/room/${room}/test-mode`,
        {}
      );

    }


    async function startGame() {

      await act(
        `/api/room/${room}/start`,
        {}
      );

    }


    async function sendClue() {

      await act(
        `/api/room/${room}/clue`,
        {
          word:
            document
              .getElementById(
                "clue"
              )
              .value,

          number:
            Number(
              document
                .getElementById(
                  "num"
                )
                .value
            )
        }
      );

    }


    async function reveal(index) {

      if (
        !state?.me ||
        state.me.role !==
          "player" ||
        state.me.team !==
          state.turn
      ) {
        return;
      }


      await act(
        `/api/room/${room}/reveal`,
        { index }
      );

    }


    async function endTurn() {

      await act(
        `/api/room/${room}/end-turn`,
        {}
      );

    }


    function render() {

      if (!state) {
        return;
      }


      say(
        state.status ===
          "finished"
          ? `Ganó ${state.winner.toUpperCase()}`
          : ""
      );


      const lobby =
        document.getElementById(
          "lobby"
        );

      const game =
        document.getElementById(
          "game"
        );


      lobby.classList.toggle(
        "hidden",
        state.status !==
          "lobby"
      );


      game.classList.toggle(
        "hidden",
        state.status ===
          "lobby"
      );


      const isOwner =
        String(
          state.ownerId
        ) ===
        String(
          tg.initDataUnsafe
            ?.user?.id
        );


      /*
        Sólo el creador ve
        Empezar y Modo prueba
      */

      document
        .getElementById(
          "startBtn"
        )
        .classList.toggle(
          "hidden",
          !isOwner
        );


      document
        .getElementById(
          "testBtn"
        )
        .classList.toggle(
          "hidden",
          !isOwner
        );


      /* JUGADORES */

      const players =
        document.getElementById(
          "players"
        );

      players.innerHTML = "";


      for (
        const p of
        state.players
      ) {

        const x =
          document.createElement(
            "span"
          );

        x.className =
          "player";


        x.textContent =
          `${
            p.team === "red"
              ? "🔴"
              : "🔵"
          } ${p.name}${
            p.role ===
            "spymaster"
              ? " 🕵️"
              : ""
          }`;


        players.appendChild(x);

      }


      if (
        state.status !==
        "lobby"
      ) {

        document
          .getElementById(
            "turn"
          )
          .textContent =
            state.turn
              .toUpperCase();


        document
          .getElementById(
            "rc"
          )
          .textContent =
            state.redRemaining;


        document
          .getElementById(
            "bc"
          )
          .textContent =
            state.blueRemaining;


        document
          .getElementById(
            "clueView"
          )
          .textContent =
            state.clue
              ? `${state.clue.word} — ${state.clue.number}`
              : "—";


        const mine =
          state.me;


        const canClue =
          mine?.role ===
            "spymaster" &&
          mine.team ===
            state.turn &&
          state.status ===
            "playing";


        const canPlay =
          mine?.role ===
            "player" &&
          mine.team ===
            state.turn &&
          state.status ===
            "playing";


        document
          .getElementById(
            "clueBox"
          )
          .classList.toggle(
            "hidden",
            !canClue
          );


        document
          .getElementById(
            "endBtn"
          )
          .classList.toggle(
            "hidden",
            !canPlay
          );


        const board =
          document.getElementById(
            "board"
          );


        board.innerHTML = "";


        state.cards.forEach(
          (c, i) => {

            const el =
              document.createElement(
                "div"
              );


            el.className =
              "card";


            el.textContent =
              c.word;


            if (
              c.revealed &&
              c.role
            ) {

              el.classList.add(
                c.role
              );

            } else if (
              mine?.role ===
                "spymaster" &&
              c.role
            ) {

              el.classList.add(
                "secret-" +
                c.role
              );

            }


            if (
              canPlay &&
              !c.revealed
            ) {

              el.onclick =
                () =>
                  reveal(i);

            }


            board.appendChild(
              el
            );

          }
        );

      }

    }


    async function refresh() {

      if (!room) {

        say(
          "Abrí la Mini App desde el botón de una partida."
        );

        return;

      }


      try {

        state =
          await api(
            `/api/room/${room}`
          );

        render();

      } catch (e) {

        say(e.message);

      }

    }


    refresh();

    setInterval(
      refresh,
      1200
    );

  </script>

</body>
</html>
